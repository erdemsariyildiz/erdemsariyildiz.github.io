<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazdağı Yangın Erken Uyarı Sistemi | Erdem Sarıyıldız</title>
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #e81c24;
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.07);
            --success-neon: #39ff14;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('arkaplan.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            margin: 0;
            scroll-behavior: smooth;
        }
        nav {
            background: rgba(15, 23, 42, 0.9);
            padding: 1rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: var(--primary); }
        .container { max-width: 900px; margin: 120px auto 50px; padding: 0 20px; }
        .header { text-align: center; margin-bottom: 60px; }
        h1 { font-size: clamp(2rem, 8vw, 3.2rem); color: var(--primary); margin: 0; text-transform: uppercase; letter-spacing: 2px; }
        .section-title { color: var(--primary); border-left: 5px solid var(--accent); padding-left: 15px; margin: 50px 0 30px; text-transform: uppercase; }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            transition: 0.4s ease;
            backdrop-filter: blur(10px);
        }
        .card p { font-size: 0.95rem; opacity: 0.85; line-height: 1.6; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .btn { padding: 12px; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.85rem; transition: 0.3s; cursor: pointer; }
        .btn-main { background: var(--primary); color: #0f172a; }
        .btn-pdf { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn:hover { opacity: 0.8; transform: scale(1.02); }
        .tag { font-size: 0.65rem; background: var(--accent); padding: 4px 10px; border-radius: 4px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
        footer { text-align: center; padding: 80px 20px; opacity: 0.6; font-size: 0.8rem; }

        /* TELEMETRİ PANELİ */
        .live-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--success-neon);
            border-radius: 14px;
            padding: 18px;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
            transition: border-color 0.4s, box-shadow 0.4s;
        }
        .live-title {
            color: var(--success-neon);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.4s;
        }
        .pulse-dot {
            width: 10px;
            height: 10px;
            background: var(--success-neon);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-neon);
            animation: pulse 1.8s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--success-neon); }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
        .data-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .data-row:last-child { margin-bottom: 0; }
        .data-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .data-box label { display: block; font-size: 0.65rem; opacity: 0.5; margin-bottom: 4px; text-transform: uppercase; }
        .data-box span { font-size: 0.95rem; font-weight: bold; color: var(--primary); }
        .not-metni { font-size: 0.72rem; opacity: 0.5; margin-top: 16px; line-height: 1.5; }
        .yenile-btn {
            margin-top: 16px; width: 100%; padding: 11px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06);
            color: white; font-weight: bold; font-size: 0.85rem; cursor: pointer;
            transition: 0.3s;
        }
        .yenile-btn:hover { background: rgba(255,255,255,0.14); border-color: var(--primary); }
        .yenile-btn:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>
    <nav>
        <a href="#baslik">Giriş</a>
        <a href="#proje">Proje</a>
        <a href="#canli-kontrol">Canlı Kontrol</a>
        <a
